services:

  openrefine-redis:
    image: "redis:alpine"
    expose:
      - "6379"

  openrefine-endpoint:
    image: registry.gitlab.com/nfdi4culture/openrefine-reconciliation-services/openrefine-wikibase:${RECONCILIATOR_VERSION}
    ports:
     - "${RECONCILIATOR_PORT}:8000"
    volumes:
     - ./reconciliator_conf/config.py:/openrefine-wikibase/config.py
     - ./reconciliator_conf/manifest.json:/openrefine-wikibase/static/manifest.json
    depends_on:
     - openrefine-redis
    env_file:
       - ".env"
